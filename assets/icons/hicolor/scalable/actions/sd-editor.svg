<?xml version="1.0" encoding="UTF-8"?>
<!-- SD Editor: a high-voltage bolt with a pencil across it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bolt" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFF176"/>
      <stop offset="0.45" stop-color="#FFD12A"/>
      <stop offset="1" stop-color="#FF9800"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- The bolt, as large as the icon. -->
  <path d="M41 1.5 L9.5 37 H29 L21.5 62.5 L55 23.5 H35.5 Z"
        fill="url(#bolt)" stroke="#7A3E00" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M38.5 6.5 L15 33.5" stroke="#FFFBE0" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>
  <!-- The pencil, writing toward the lower left. -->
  <g transform="translate(21 60) rotate(-41)" stroke="#111827" stroke-width="1.4" stroke-linejoin="round">
    <path d="M0 0 L10 -5.5 H11 V5.5 H10 Z" fill="#F6D2A2"/>
    <path d="M0 0 L3.6 -2 V2 Z" fill="#1F2937" stroke-width="0.8"/>
    <rect x="11" y="-5.5" width="22" height="11" fill="url(#body)"/>
    <path d="M11 -1.8 H33 M11 1.8 H33" stroke="#BFDBFE" stroke-width="0.9" opacity="0.8"/>
    <rect x="33" y="-5.5" width="4.5" height="11" fill="#D1D5DB"/>
    <rect x="37.5" y="-5.5" width="6" height="11" rx="2.2" fill="#F472B6"/>
  </g>
</svg>

[package]
name = "super-desktop"
version = "1.1.21"
edition = "2021"
default-run = "super-desktop"
authors = ["gladimdim"]
description = "High-performance Wayland LayerShell overlay for sticky notes and AI terminals on Omarchy / Hyprland"

[features]
default = ["desktop"]
desktop = [
    "dep:gtk4", "dep:gtk4-layer-shell", "dep:vte4", "dep:shlex", "dep:chrono",
    "dep:futures-channel", "dep:futures-util", "dep:rustls", "dep:rcgen",
    "dep:qrcode", "dep:reqwest", "dep:tungstenite", "dep:pulldown-cmark",
]

[[bin]]
name = "super-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "super-desktop-client"
path = "src/bin/super-desktop-client.rs"

[[test]]
name = "cli_offline"
required-features = ["desktop"]

[[test]]
name = "cli_control"
required-features = ["desktop"]

[dependencies]
gtk4 = { version = "0.11", features = ["v4_18"], optional = true }
vte4 = { version = "0.10", features = ["v0_84"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = { version = "2.0.1", optional = true }
chrono = { version = "0.4", optional = true }
libc = "0.2"
futures-channel = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"], optional = true }
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false, optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"], optional = true }
base64 = "0.22"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"], optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false, optional = true }
schemars = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk4-layer-shell = { version = "0.8", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# Keep the symbol table: a panic here aborts the daemon, and the crash log's
# backtrace (src/crashlog.rs) is only useful if frames can be named. DWARF
# debuginfo is still dropped.
strip = "debuginfo"

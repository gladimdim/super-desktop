[package]
name = "super-desktop"
version = "1.1.4"
edition = "2021"
default-run = "super-desktop"
authors = ["gladimdim"]
description = "High-performance Wayland LayerShell overlay for sticky notes and AI terminals on Omarchy / Hyprland"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_18"] }
gtk4-layer-shell = "0.8"
vte4 = { version = "0.10", features = ["v0_84"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "2.0.1"
chrono = "0.4"
libc = "0.2"
futures-channel = "0.3"
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
base64 = "0.22"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# Keep the symbol table: a panic here aborts the daemon, and the crash log's
# backtrace (src/crashlog.rs) is only useful if frames can be named. DWARF
# debuginfo is still dropped.
strip = "debuginfo"

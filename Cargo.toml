[package]
name = "super-desktop"
version = "1.1.0"
edition = "2021"
authors = ["gladimdim"]
description = "High-performance Wayland LayerShell overlay for sticky notes and AI terminals on Omarchy / Hyprland"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_18"] }
gtk4-layer-shell = "0.8"
vte4 = { version = "0.10", features = ["v0_84"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
